<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Disneyland Reviews — RAG Assistant</title>
  <style>
    /* ── Reset & base ──────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f1117;
      --surface:  #1a1d2e;
      --border:   #2a2d3e;
      --accent:   #6366f1;
      --accent-h: #818cf8;
      --text:     #e2e8f0;
      --muted:    #94a3b8;
      --success:  #22c55e;
      --error:    #ef4444;
      --warning:  #f59e0b;
      --radius:   12px;
      --font:     -apple-system, "Segoe UI", system-ui, sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ────────────────────────────────────────────────────────── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent-h);
    }

    .logo-icon { font-size: 1.6rem; }

    /* ── Ingest button ─────────────────────────────────────────────────── */
    #ingest-btn {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 0.55rem 1.2rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    #ingest-btn:hover:not(:disabled) { background: var(--accent-h); }
    #ingest-btn:active:not(:disabled) { transform: scale(0.97); }
    #ingest-btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Status bar ────────────────────────────────────────────────────── */
    #status-bar {
      font-size: 0.8rem;
      padding: 0.45rem 1rem;
      border-radius: 8px;
      display: none;
      max-width: 420px;
    }
    #status-bar.success { background: rgba(34,197,94,0.15); color: var(--success); }
    #status-bar.error   { background: rgba(239,68,68,0.15);  color: var(--error); }

    /* ── Main layout ───────────────────────────────────────────────────── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      padding: 1.5rem 1rem;
      gap: 1.25rem;
    }

    /* ── Chat history ──────────────────────────────────────────────────── */
    #chat-history {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      min-height: 300px;
      max-height: 58vh;
      padding-right: 4px;
    }
    #chat-history::-webkit-scrollbar { width: 6px; }
    #chat-history::-webkit-scrollbar-track { background: transparent; }
    #chat-history::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ── Message bubbles ───────────────────────────────────────────────── */
    .message { display: flex; gap: 0.75rem; align-items: flex-start; }
    .message.user  { flex-direction: row-reverse; }

    .avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    .message.user  .avatar { background: var(--accent); }
    .message.bot   .avatar { background: #2d3042; }

    .bubble {
      max-width: 75%;
      padding: 0.75rem 1rem;
      border-radius: var(--radius);
      line-height: 1.6;
      font-size: 0.92rem;
    }
    .message.user .bubble {
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .message.bot .bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    /* ── Sub-queries badge strip ───────────────────────────────────────── */
    .sub-queries {
      margin-top: 0.55rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .sq-badge {
      font-size: 0.72rem;
      background: rgba(99,102,241,0.2);
      color: var(--accent-h);
      border-radius: 20px;
      padding: 0.2rem 0.6rem;
      border: 1px solid rgba(99,102,241,0.3);
    }

    /* ── Citations ──────────────────────────────────────────────────────── */
    .citations { margin-top: 0.75rem; }
    .citations summary {
      font-size: 0.78rem;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }
    .citations summary:hover { color: var(--accent-h); }
    .citations-grid {
      margin-top: 0.5rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 0.5rem;
    }
    .citation-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem 0.7rem;
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.5;
    }
    .citation-card strong { color: var(--text); }

    /* ── Stars ──────────────────────────────────────────────────────────── */
    .stars { color: var(--warning); letter-spacing: -1px; }

    /* ── Input area ─────────────────────────────────────────────────────── */
    .input-row {
      display: flex;
      gap: 0.6rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.5rem;
    }
    #question-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 0.92rem;
      padding: 0.35rem 0.5rem;
      resize: none;
      font-family: var(--font);
      line-height: 1.5;
    }
    #question-input::placeholder { color: var(--muted); }

    #send-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    #send-btn:hover:not(:disabled) { background: var(--accent-h); }
    #send-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    #send-btn svg { pointer-events: none; }

    /* ── Typing indicator ───────────────────────────────────────────────── */
    .typing-dots { display: flex; gap: 4px; padding: 4px 0; }
    .typing-dots span {
      width: 7px; height: 7px;
      background: var(--muted);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%,80%,100% { transform: translateY(0); }
      40%          { transform: translateY(-6px); }
    }

    /* ── Empty state ─────────────────────────────────────────────────────── */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
      padding: 2rem;
    }
    .empty-icon { font-size: 3rem; opacity: 0.5; }
  </style>
</head>
<body>

  <!-- ── Header ─────────────────────────────────────────────────────────── -->
  <header>
    <div class="logo">
      <span class="logo-icon">🏰</span>
      Disneyland RAG Assistant
    </div>

    <div style="display:flex; align-items:center; gap:0.75rem; flex-wrap:wrap;">
      <span id="status-bar"></span>
      <button id="ingest-btn" title="Load & embed Disney reviews into ChromaDB">
        <span class="spinner" id="ingest-spinner"></span>
        <span id="ingest-label">⚡ Ingest Data</span>
      </button>
    </div>
  </header>

  <!-- ── Main ───────────────────────────────────────────────────────────── -->
  <main>
    <div id="chat-history">
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">💬</div>
        <p>Ask anything about Disneyland reviews.</p>
        <p style="font-size:0.78rem; opacity:0.7;">Click <strong>⚡ Ingest Data</strong> first if this is a fresh start.</p>
      </div>
    </div>

    <form class="input-row" id="chat-form" autocomplete="off">
      <textarea
        id="question-input"
        rows="1"
        placeholder="Ask a question about Disneyland reviews…"
        maxlength="600"
      ></textarea>
      <button type="submit" id="send-btn" aria-label="Send">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
             viewBox="0 0 24 24">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </form>
  </main>

  <script>
    // ── DOM refs ──────────────────────────────────────────────────────────
    const chatHistory    = document.getElementById("chat-history");
    const emptyState     = document.getElementById("empty-state");
    const chatForm       = document.getElementById("chat-form");
    const questionInput  = document.getElementById("question-input");
    const sendBtn        = document.getElementById("send-btn");
    const ingestBtn      = document.getElementById("ingest-btn");
    const ingestSpinner  = document.getElementById("ingest-spinner");
    const ingestLabel    = document.getElementById("ingest-label");
    const statusBar      = document.getElementById("status-bar");

    // ── Helpers ───────────────────────────────────────────────────────────
    function stars(n) {
      return "★".repeat(Math.max(0, Math.min(5, n))) +
             "☆".repeat(5 - Math.max(0, Math.min(5, n)));
    }

    function hideEmpty() {
      if (emptyState) emptyState.remove();
    }

    function scrollBottom() {
      chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    function showStatus(msg, type) {
      statusBar.textContent = msg;
      statusBar.className = type;
      statusBar.style.display = "block";
      if (type === "success") setTimeout(() => { statusBar.style.display = "none"; }, 5000);
    }

    // ── Append a user bubble ──────────────────────────────────────────────
    function appendUser(text) {
      hideEmpty();
      const el = document.createElement("div");
      el.className = "message user";
      el.innerHTML = `
        <div class="avatar">🧑</div>
        <div class="bubble">${escHtml(text)}</div>
      `;
      chatHistory.appendChild(el);
      scrollBottom();
    }

    // ── Typing indicator ──────────────────────────────────────────────────
    function appendTyping() {
      const el = document.createElement("div");
      el.className = "message bot";
      el.id = "typing-msg";
      el.innerHTML = `
        <div class="avatar">🤖</div>
        <div class="bubble">
          <div class="typing-dots"><span></span><span></span><span></span></div>
        </div>
      `;
      chatHistory.appendChild(el);
      scrollBottom();
      return el;
    }

    // ── Append a bot bubble ───────────────────────────────────────────────
    function appendBot(data, typingEl) {
      const { answer, citations = [], sub_queries = [] } = data;

      let subQhtml = "";
      if (sub_queries.length > 0) {
        const badges = sub_queries
          .map(q => `<span class="sq-badge">🔍 ${escHtml(q)}</span>`)
          .join("");
        subQhtml = `<div class="sub-queries">${badges}</div>`;
      }

      let citHtml = "";
      if (citations.length > 0) {
        const cards = citations.map(c => `
          <div class="citation-card">
            <strong>${escHtml(c.branch || "—")}</strong><br>
            <span class="stars">${stars(c.rating || 0)}</span> ${c.rating || "?"}/5<br>
            📍 ${escHtml(c.location || "—")}<br>
            🗓 ${escHtml(c.year_month || "—")}<br>
            <span style="font-size:0.7rem; opacity:0.6;">ID: ${escHtml(c.review_id || "—")}</span>
          </div>
        `).join("");

        citHtml = `
          <details class="citations">
            <summary>📌 ${citations.length} source${citations.length > 1 ? "s" : ""}</summary>
            <div class="citations-grid">${cards}</div>
          </details>
        `;
      }

      typingEl.querySelector(".bubble").innerHTML =
        `<p style="white-space:pre-wrap">${escHtml(answer)}</p>
         ${subQhtml}
         ${citHtml}`;

      scrollBottom();
    }

    // ── Escape HTML ───────────────────────────────────────────────────────
    function escHtml(str) {
      return String(str ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;");
    }

    // ── Auto-grow textarea ────────────────────────────────────────────────
    questionInput.addEventListener("input", () => {
      questionInput.style.height = "auto";
      questionInput.style.height = questionInput.scrollHeight + "px";
    });

    questionInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        chatForm.requestSubmit();
      }
    });

    // ── Send message ──────────────────────────────────────────────────────
    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const question = questionInput.value.trim();
      if (!question) return;

      questionInput.value = "";
      questionInput.style.height = "auto";
      sendBtn.disabled = true;

      appendUser(question);
      const typingEl = appendTyping();

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });
        const data = await res.json();

        if (res.status === 503) {
          // Ingestion not ready — show as a soft warning, not a red error
          typingEl.querySelector(".bubble").innerHTML =
            `<span style="color:var(--warning)">${escHtml(data.error || "Ingestion in progress. Please wait and try again.")}</span>`;
        } else if (!res.ok) {
          typingEl.querySelector(".bubble").innerHTML =
            `<span style="color:var(--error)">⚠ ${escHtml(data.error || "Something went wrong.")}</span>`;
        } else {
          appendBot(data, typingEl);
        }
      } catch (err) {
        typingEl.querySelector(".bubble").innerHTML =
          `<span style="color:var(--error)">⚠ Network error. Please try again.</span>`;
      } finally {
        sendBtn.disabled = false;
        questionInput.focus();
      }
    });

    // ── Ingest data ───────────────────────────────────────────────────────
    ingestBtn.addEventListener("click", async () => {
      ingestBtn.disabled = true;
      ingestSpinner.style.display = "block";
      ingestLabel.textContent = "Ingesting…";
      showStatus("Ingestion in progress. This may take a few minutes…", "success");

      try {
        const res  = await fetch("/ingest", { method: "POST" });
        const data = await res.json();

        if (res.ok) {
          showStatus(
            `✅ Ingested ${data.total_rows} rows → ${data.total_chunks} chunks into "${data.collection_name}"`,
            "success"
          );
        } else {
          showStatus(`❌ ${data.message || "Ingestion failed."}`, "error");
        }
      } catch (err) {
        showStatus("❌ Network error during ingestion.", "error");
      } finally {
        ingestBtn.disabled = false;
        ingestSpinner.style.display = "none";
        ingestLabel.textContent = "⚡ Ingest Data";
      }
    });
  </script>
</body>
</html>
